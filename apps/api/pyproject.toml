[project]
name = "furnace-api"
version = "0.1.0"
description = "Furnace HTTP API (FastAPI)."
requires-python = ">=3.12"
dependencies = [
  "furnace",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["furnace_api"]
