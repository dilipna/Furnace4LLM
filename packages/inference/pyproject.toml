[project]
name = "furnace-bench"
version = "0.1.0"
description = "Async streaming load generator and SLO-goodput benchmark for OpenAI-compatible LLM servers (vLLM, SGLang, Ollama)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12.560"]
tokenizers = ["tokenizers>=0.20", "huggingface-hub>=0.26"]
lab = ["docker>=7.1"]

[project.scripts]
furnace-bench = "furnace_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/furnace_bench"]

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py310"  # must run on Kaggle/Colab Python 3.10+
