name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: furnace
          POSTGRES_PASSWORD: furnace
          POSTGRES_DB: furnace
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U furnace" --health-interval 3s --health-retries 20
    env:
      FURNACE_DATABASE_URL: postgresql+asyncpg://furnace:furnace@localhost:5433/furnace
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run pyright
      - run: uv run alembic -c packages/furnace/src/furnace/db/alembic.ini upgrade head
      - run: uv run pytest -q -m "not gpu"

  web:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json  # packageManager lives there, not at the root
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - run: pnpm build
      # the public recorded-only site: static export + the Pages Function's range parser
      - run: node --test cloudflare/range.test.mjs
      - run: node --test lib/prefix-check.test.mjs
      - run: NEXT_PUBLIC_RECORDED_ONLY=true pnpm build:static

  image:
    # The Render deploy builds this image; build it on every push so a broken Dockerfile is
    # caught here (a missing package README once broke it unnoticed).
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t furnace-api:ci .
      - run: docker run --rm --entrypoint uv furnace-api:ci run --no-sync python -c "import furnace_api.main"
